stages:
  - trigger
  - build
  - unit-tests
  - e2e-tests
  - deploy
  - portainer

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
   - sopro
  
  script: 
    - cd Trainee_Tracker
    - dotnet build

unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
   - sopro

  needs: 
    - build
  
  script: 
    - cd Trainee_Tracker
    - dotnet test

e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
   - sopro

  needs: 
    - build
  
  script: 
    - cd Trainee_Tracker
    - dotnet run --environment Development &

    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget gnupg ca-certificates
    - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -y --no-install-recommends ./google-chrome-stable_current_amd64.deb
    - rm google-chrome-stable_current_amd64.deb
    - google-chrome --version

    - sleep 10

    - cd ../Trainee_Tracker.E2ETests
    - dotnet test

deploy:
  stage: deploy
  image: docker:latest
  tags:
    - sopro
  needs:
    - unit-tests
    - e2e-tests

  services:
    - docker:dind       
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375

  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest ./Trainee_Tracker
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest

portainer:
  stage: portainer
  image: curlimages/curl:latest
  tags:
    - sopro
  needs:
    - deploy
  script:
    - sleep 10
    - curl -X POST $CONTAINER_WEB_HOOK


trigger_check:
  stage: trigger
  image: curlimages/curl:latest
  tags:
    - sopro

  script:
    - |
      curl --fail --request POST \
        --form token=$DOWNSTREAM_TRIGGER_TOKEN \
        --form ref=main \
        --form "variables[STUDENT_REPO_PATH]=$CI_PROJECT_PATH" \
        --form "variables[STUDENT_PROJECT_ID]=$CI_PROJECT_ID" \
        --form "variables[MR_ID]=$CI_MERGE_REQUEST_IID" \
        --form "variables[STUDENT_SOURCE_BRANCH]=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" \
        "$CI_API_V4_URL/projects/$(echo lehre/sopro/2026-sose/sopro-2026-autokorrektur | sed 's/\//%2F/g')/trigger/pipeline"

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'