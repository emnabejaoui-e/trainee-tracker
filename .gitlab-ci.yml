stages:
  - build
  - unit-tests
  - e2e-tests
  - deploy

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  script:
    - cd Trainee_Tracker
    - dotnet build

unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker.UnitTests
    - dotnet test

e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker
    - dotnet run --environment Development &
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget gnupg ca-certificates
    - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -y --no-install-recommends ./google-chrome-stable_current_amd64.deb
    - rm google-chrome-stable_current_amd64.deb
    - google-chrome --version
    - sleep 10
    - cd ../Trainee_Tracker.E2ETests
    - dotnet test
deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  tags:
    - sopro

  needs:
    - unit-tests
    - e2e-tests

  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest ./Trainee_Tracker
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest