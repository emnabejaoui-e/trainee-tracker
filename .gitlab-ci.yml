stages:
  - build
  - unit-tests
  - e2e-tests
  - deploy
  - portainer

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  script:
    - cd Trainee_Tracker
    - dotnet build

unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker.UnitTests
    - dotnet test

e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker
    - dotnet run --environment Development &
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget gnupg ca-certificates
    - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -y --no-install-recommends ./google-chrome-stable_current_amd64.deb
    - rm google-chrome-stable_current_amd64.deb
    - google-chrome --version
    - sleep 10
    - cd ../Trainee_Tracker.E2ETests
    - dotnet test

deploy:
  stage: deploy
  image: quay.io/podman/stable
  tags:
    - sopro
  before_script:
    - podman info
    - podman login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - podman build -t gitlab.isse.de:5050/lehre/sopro/2026-sose/gruppen/team14/main:trainee_tracker .
    - podman push gitlab.isse.de:5050/lehre/sopro/2026-sose/gruppen/team14/main:trainee_tracker
  needs:
    - unit-tests
    - e2e-tests
  only:
    refs:
      - main

portainer:
  stage: portainer
  image: curlimages/curl:latest
  tags:
    - sopro
  needs:
    - deploy
  script:
    - sleep 10
    - curl -X POST https://portainer.isse.de/api/webhooks/1774c4f4-c8c7-4161-a6a4-a2fe46b92e7b
  only:
    refs:
      - main
