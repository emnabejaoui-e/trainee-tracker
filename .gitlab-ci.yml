stages:
  - build
  - unit-tests
  - e2e-tests
  - deploy
  - portainer

build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  script:
    - cd Trainee_Tracker
    - dotnet build

unit-tests:
  stage: unit-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker.UnitTests
    - dotnet test

e2e-tests:
  stage: e2e-tests
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags:
    - sopro
  needs:
    - build
  script:
    - cd Trainee_Tracker
    - dotnet run --environment Development &
    - apt-get update -qq
    - apt-get install -y --no-install-recommends wget gnupg ca-certificates
    - wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    - apt-get install -y --no-install-recommends ./google-chrome-stable_current_amd64.deb
    - rm google-chrome-stable_current_amd64.deb
    - google-chrome --version
    - sleep 10
    - cd ../Trainee_Tracker.E2ETests
    - dotnet test

deploy:
  stage: deploy
  image:
    name: moby/buildkit:rootless
    entrypoint: [ "" ]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=gitlab.isse.de:5050/lehre/sopro/2026-sose/gruppen/team14/main:trainee_tracker,push=true
  needs:
    - unit-tests
    - e2e-tests
  only:
    refs:
      - main

portainer:
  stage: portainer
  image: curlimages/curl:latest
  tags:
    - sopro
  needs:
    - deploy
  script:
    - sleep 10
    - curl -X POST https://portainer.isse.de/api/webhooks/1774c4f4-c8c7-4161-a6a4-a2fe46b92e7b
  only:
    refs:
      - main
